body = """
A deliberately small web server. Content lives in a TOML file compiled into
the binary, pages are rendered with [askama](https://github.com/askama-rs/askama)
templates that are type-checked at build time, and the whole thing ships as a
single container on DigitalOcean.

## Stack

- **axum** for routing, with `tower-http` for compression, timeouts, tracing
  and security headers
- **askama** for compile-time templates
- **pulldown-cmark** for the Markdown you're reading now
"""

[[project]]
slug = "vtracker"
title = "vTracker"
summary = "A case tracker that runs in 5 MB of RAM and serves pages in about 3 ms, even with a million customers."
status = "active"
tags = ["rust", "axum", "sqlx", "postgres", "askama"]
featured = true
url = "https://vtracker.um9i.dev/"
body = """
vTracker tracks background-check investigations for customers. It started life
as a Django app. I rewrote it in Rust with one goal: make it as lean as
possible without losing a single feature. It keeps the same data model and the
same routes, and needs a fraction of the resources.

## The numbers

- **About 5 MB of RAM**, idle and under load. A 10-minute soak test grew it by
  52 KB.
- **About 3 ms median response** on a database seeded with 1 million customers
  and 2 million investigations, with the 99th percentile under 6 ms on almost
  every page.
- **Around 1,200 requests a second** at peak, with response times flat at about
  3 ms up to 960 req/s. The limit is the database connection pool, not the app,
  which uses less than a third of one CPU core at that point.
- **2 to 8 database round trips per page**, because every query has to earn
  its place.

The response times come from settings built to match production (one CPU, 1 ms
of extra database latency), not from a 12-core laptop talking to a local
database.

## How

- **axum** on a small hyper accept loop, with server-side sessions in Postgres
- **SQLx** against a managed Postgres, with `pg_trgm` indexes so search stays
  fast across a million rows
- **askama** templates, checked when the code compiles
- **argon2** password hashing on its own thread, away from the threads that serve pages
- Release builds squeezed for size: `opt-level = "z"`, LTO, stripped symbols

## Proved, not guessed

vTracker comes with its own benchmark tool. It starts the server, logs in and
load-tests every route. It reports latency percentiles, memory, and the exact
number of Postgres round trips per request, which it counts with a proxy that
reads the database wire protocol. Every optimization gets a baseline, one
change and a comparison. If the numbers don't move, the change doesn't ship.
"""

