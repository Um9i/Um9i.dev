[package]
name = "um9i"
version = "0.1.0"
edition = "2024"
description = "Source for https://um9i.dev — a showcase of things I am working on."
publish = false

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "net"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-gzip", "compression-br", "set-header", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
# The lib exists only to be shared by main.rs and tests, not published, so
# public-API documentation lints are noise here.
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
