<article class="card">
  <div class="card-top"><span class="project-symbol" aria-hidden="true">&lt;/&gt;</span></div>
  <header class="card-head">
    <h3><a href="/projects/{{ p.slug }}">{{ p.title }}</a></h3>
    <span class="status status-{{ p.status.label() }}">{{ p.status.label() }}</span>
  </header>
  <p>{{ p.summary }}</p>
  {% if !p.tags.is_empty() %}
  <ul class="tags" aria-label="Tags">
    {% for tag in p.tags %}<li>{{ tag }}</li>{% endfor %}
  </ul>
  {% endif %}
  <div class="card-foot" aria-hidden="true"><span>Read project</span><span class="card-arrow">&rarr;</span></div>
</article>
